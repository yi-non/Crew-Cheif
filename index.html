<!DOCTYPE html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ינשוף</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#171b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ינשוף">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#171b16;color:#e8ebe0;font:17px "Segoe UI",Arial,sans-serif}
form{width:min(340px,90vw);background:#222820;border:1px solid #38402f;border-radius:12px;padding:24px}
h1{font-size:20px;margin:0 0 14px}
input[type=password],button{width:100%;font:inherit;padding:12px;border-radius:8px;border:1px solid #38402f;margin-top:10px}
input[type=password]{background:#171b16;color:#e8ebe0;text-align:center;letter-spacing:4px}
button{background:#e8a838;color:#1a1a10;font-weight:700;cursor:pointer}button:disabled{opacity:.5}
label{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px;color:#9aa391}
#e{color:#e0584f;min-height:24px;margin-top:8px;font-size:15px}
</style></head><body>
<form id="f"><h1>ינשוף · כניסה</h1>
<input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password" aria-label="סיסמה">
<label><input id="rm" type="checkbox" checked> הישאר מחובר במכשיר זה</label>
<button id="b">כניסה</button><div id="e" role="alert"></div><div id="ok" role="status" style="margin-top:8px;font-size:14px;color:#7fbf6a"></div></form>
<script>
(()=>{
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});
 navigator.serviceWorker.ready.then(()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  const o=document.querySelector("#ok");if(o)o.textContent="מוריד את האפליקציה למכשיר… נא להישאר מחובר לרשת";
  const t=setInterval(async()=>{try{if(await caches.match("data.bin")){clearInterval(t);const o=document.querySelector("#ok");if(o)o.textContent="✓ האפליקציה שמורה במכשיר ותעבוד גם בלי קליטה"}}catch(e){clearInterval(t)}},1000)})}
const $=s=>document.querySelector(s),K="yk1",IT=1000000;
let P;const getData=()=>P||(P=fetch("data.bin").then(r=>{if(!r.ok)throw new Error("net");return r.arrayBuffer()}));
const dec=async(key,buf)=>new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:buf.slice(16,28)},key,buf.slice(28)));
const go=h=>{document.open();document.write(h);document.close()};
(async()=>{let s;try{s=localStorage.getItem(K)}catch(e){}if(!s)return;
 $("#e").textContent="טוען…";let buf;try{buf=await getData()}catch(e){$("#e").textContent="אין חיבור והנתונים עדיין לא נשמרו במכשיר.";return}
 try{go(await dec(await crypto.subtle.importKey("raw",Uint8Array.from(atob(s),c=>c.charCodeAt(0)),"AES-GCM",false,["decrypt"]),buf))}
 catch(e){try{localStorage.removeItem(K)}catch(x){}$("#e").textContent=""}})();
$("#f").onsubmit=async e=>{e.preventDefault();const b=$("#b"),m=$("#e");b.disabled=true;m.textContent="בודק…";
 if(!window.crypto||!crypto.subtle){m.textContent="נדרש חיבור מאובטח (HTTPS).";b.disabled=false;return}
 let buf;try{buf=await getData()}catch(x){m.textContent="אין חיבור והנתונים עדיין לא נשמרו במכשיר.";b.disabled=false;return}
 try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode($("#pw").value),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:buf.slice(0,16),iterations:IT,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
  const html=await dec(key,buf);
  if($("#rm").checked){try{localStorage.setItem(K,btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw",key)))))}catch(x){}}
  go(html)}
 catch(x){m.textContent="סיסמה שגויה.";b.disabled=false}};
})();
</script></body></html>
